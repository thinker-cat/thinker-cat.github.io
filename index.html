<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>look how cool</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 50px;
            background: #f0f0f0;
        }
        .card {
            background: white;
            /* Added padding on the bottom to fit the horizontal signature cleanly */
            padding: 30px 40px 90px 40px;
            display: inline-block;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            
            /* FIXED: Widened the card base so it doesn't look like a narrow strip */
            width: 450px; 
            box-sizing: border-box;
            position: relative; 
        }
        .my-link {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }
        .my-link:hover {
            color: #004499;
            text-underline-offset: 3px;
            text-decoration: underline;
        }
        /* Custom styles for your brand new native video player */
        .my-video {
            display: block;
            margin: 25px auto;
            border-radius: 8px;
            
            /* FIXED: Set to a clean width that fits the new 450px wide card beautifully */
            width: 260px;
            height: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .my-gif {
            display: block;
            margin: 25px auto 0 auto;
            border-radius: 8px;
            
            /* FIXED: Scaled up your yellow GIF slightly to balance the wider layout space */
            width: 320px;
            height: auto;
        }
        /* Aligns the text and the image side-by-side on a single horizontal line */
        .bottom-right-container {
            position: absolute;
            bottom: 20px;
            right: 25px;
            display: flex;
            flex-direction: row; 
            align-items: center; 
            gap: 10px;            
        }
        .credit-text {
            font-size: 11px;
            color: #777777;
            margin: 0;           
            font-style: italic;
            white-space: nowrap; 
        }
        .my-small-image {
            display: block;
            border-radius: 4px;
            width: 65px !important;  
            height: auto;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>look at my website</h1>
        <p>now always online!!! thanks github :D</p>
        <p><a class="my-link" href="https://youtube.com" target="_blank">Click :0</a></p>
        
        <!-- LOCAL VIDEO PLAYER SECTION (Clean tutorial format layout) -->
        <video class="my-video" controls muted>
            <source src="videoforwebsite.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <!-- THE ORIGINAL AMONG US GIF -->
        <img class="my-gif" src="animation.gif" alt="should play a gif">

        <!-- PINNED TO THE VERY BOTTOM RIGHT (Now arranged horizontally) -->
        <div class="bottom-right-container">
            <p class="credit-text">made by thinker cat</p>
            <img class="my-small-image" src="thinker.png" alt="thinker cat image">
        </div>
    </div>

</body>
</html>

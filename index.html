<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>look how cool</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 50px;
            background: #f0f0f0;
        }
        .card {
            background: white;
            padding: 30px;
            display: inline-block;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-width: 320px; 
            box-sizing: border-box;
        }
        .my-link {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }
        .my-link:hover {
            color: #004499;
            text-decoration: underline;
        }
        .my-gif {
            display: block;
            margin: 20px auto 0 auto;
            border-radius: 6px;
            max-width: 100%;
            height: auto;
        }
        /* Aligns the wrapper content to the far right side */
        .bottom-right-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            margin-top: 25px;
            width: 100%;
        }
        .credit-text {
            font-size: 13px;
            color: #555555;
            margin: 0 0 5px 0;
            font-style: italic;
        }
        /* Strictly locks the image size so it CANNOT stretch out */
        .my-small-image {
            display: block;
            border-radius: 6px;
            width: 100px !important;  /* Forces the width to stay tiny */
            height: auto;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>look at my website</h1>
        <p>now always online!!! thanks github :D</p>
        <p><a class="my-link" href="https://youtube.com" target="_blank">Click :0</a></p>
        
        <!-- THE ORIGINAL GIF -->
        <img class="my-gif" src="animation.gif" alt="should play a gif" width="300">

        <!-- THE CORNER CONTAINER -->
        <div class="bottom-right-container">
            <p class="credit-text">made by thinker cat</p>
            <!-- STAYS LOCKED AT 100PX WIDE -->
            <img class="my-small-image" src="thinker.png" alt="thinker cat image">
        </div>
    </div>

</body>
</html>

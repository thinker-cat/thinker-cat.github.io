<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>look how cool</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #f0f0f0; }
        .card { background: white; padding: 30px; display: inline-block; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* This styles your link */
        .my-link { 
            color: #0066cc; 
            text-decoration: none; 
            font-weight: bold; 
        }
        .my-link:hover { 
            color: #004499; 
            text-decoration: underline; 
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>look at my website</h1>
        <p>only works when i start it up</p>
        
        <!-- Clickable link added below -->
        <p><a class="my-link" href="https://www.youtube.com/watch?v=j5a0jTc9S10" target="_blank">Click here to go to Google</a></p>
    </div>
</body>
</html>

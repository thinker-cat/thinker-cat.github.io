<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>look how cool</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 50px;
            background: #f0f0f0;
        }
        .card {
            background: white;
            /* Adjusted padding to fit the new horizontal signature cleanly */
            padding: 30px 30px 90px 30px;
            display: inline-block;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-width: 320px; 
            max-width: 680px; 
            box-sizing: border-box;
            position: relative; 
        }
        .my-link {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }
        .my-link:hover {
            color: #004499;
            text-decoration: underline;
        }
        .my-video {
            display: block;
            margin: 20px auto;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .my-gif {
            display: block;
            margin: 20px auto 0 auto;
            border-radius: 6px;
            max-width: 100%;
            height: auto;
        }
        /* Aligns the text and the image side-by-side on a single horizontal line */
        .bottom-right-container {
            position: absolute;
            bottom: 15px;
            right: 15px;
            display: flex;
            flex-direction: row; /* Changed from column to row to align items horizontally */
            align-items: center; /* Centers the text vertically against the image */
            gap: 8px;            /* Adds space between the text and the image */
        }
        .credit-text {
            font-size: 11px;
            color: #777777;
            margin: 0;           /* Removed bottom margin so it lines up straight */
            font-style: italic;
            white-space: nowrap; /* Prevents the text from breaking into two lines */
        }
        .my-small-image {
            display: block;
            border-radius: 4px;
            width: 75px !important;  
            height: auto;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>look at my website</h1>
        <p>now always online!!! thanks github :D</p>
        <p><a class="my-link" href="https://youtube.com" target="_blank">Click :0</a></p>
        
        <!-- NEW LOCAL VIDEO PLAYER SECTION -->
        <video class="my-video" width="120" controls muted>
            <source src="videoforwebsite.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <!-- THE ORIGINAL GIF -->
        <img class="my-gif" src="animation.gif" alt="should play a gif" width="300">

        <!-- PINNED TO THE VERY BOTTOM RIGHT (Now arranged horizontally) -->
        <div class="bottom-right-container">
            <p class="credit-text">made by thinker cat</p>
            <img class="my-small-image" src="thinker.png" alt="thinker cat image">
        </div>
    </div>

</body>
</html>

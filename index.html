<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>look how cool</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 50px;
            background: #f0f0f0;
        }
        .card {
            background: white;
            padding: 30px;
            display: inline-block;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .my-link {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }
        .my-link:hover {
            color: #004499;
            text-decoration: underline;
        }
        .my-gif {
            display: block;
            margin: 20px auto 0 auto;
            border-radius: 6px;
            max-width: 100%;
            height: auto;
        }
        /* Style for your new custom text */
        .credit-text {
            font-size: 14px;
            color: #555555;
            margin-top: 25px;
            margin-bottom: 5px;
            font-style: italic;
        }
        /* Style to make your PNG image smaller */
        .my-small-image {
            display: block;
            margin: 0 auto;
            border-radius: 6px;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>look at my website</h1>
        <p>now always online!!! thanks github :D</p>
        <p><a class="my-link" href="https://youtube.com" target="_blank">Click :0</a></p>
        
        <!-- THE ORIGINAL GIF (STAYS AS IS) -->
        <img class="my-gif" src="animation.gif" alt="should play a gif" width="300">

        <!-- YOUR NEW TEXT -->
        <p class="credit-text">made by thinker cat</p>

        <!-- YOUR SMALLER .PNG IMAGE -->
        <img class="my-small-image" src="image.png" alt="my new png image" width="150">
    </div>

</body>
</html>

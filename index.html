<body class="theme-dark">

    <!-- JAVASCRIPT LOGIC SECTION -->
    <script>
        function changeTheme(themeName) {
            document.body.className = '';
            document.body.classList.add(themeName);
        }

        function changeVideo(videoFileName) {
            var videoPlayer = document.getElementById('mainWebVideo');
            videoPlayer.src = videoFileName;
            videoPlayer.load();
            videoPlayer.play();
        }

        // Emergency exit — press Esc to instantly jump to Google
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                location.replace('https://www.google.com');
            }
        });

        // ================================
        // BACKGROUND ANIMATION SYSTEM
        // ================================
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        let bgMode = 'particles';
        let bgAnimFrame;
        let particles = [];
        let stars = [];
        let shapes = [];
        let gradientHue = 0;

        function resizeCanvas() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function initParticles() {
            particles = Array.from({ length: 40 }, () => ({
                x: Math.random() * bgCanvas.width,
                y: Math.random() * bgCanvas.height,
                r: 2 + Math.random() * 4,
                speed: 0.3 + Math.random() * 0.8,
                drift: (Math.random() - 0.5) * 0.5,
                opacity: 0.2 + Math.random() * 0.4
            }));
        }

        function initStars() {
            stars = Array.from({ length: 100 }, () => ({
                x: Math.random() * bgCanvas.width,
                y: Math.random() * bgCanvas.height,
                r: Math.random() * 1.5,
                twinkleSpeed: 0.02 + Math.random() * 0.04,
                twinklePhase: Math.random() * Math.PI * 2
            }));
        }

        function initShapes() {
            const shapeTypes = ['circle', 'square', 'triangle'];
            shapes = Array.from({ length: 12 }, () => ({
                x: Math.random() * bgCanvas.width,
                y: Math.random() * bgCanvas.height,
                size: 15 + Math.random() * 25,
                speed: 0.2 + Math.random() * 0.4,
                rotation: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.02,
                type: shapeTypes[Math.floor(Math.random() * shapeTypes.length)],
                opacity: 0.1 + Math.random() * 0.15
            }));
        }

        function drawParticles() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            particles.forEach(p => {
                p.y -= p.speed;
                p.x += p.drift;
                if (p.y < -10) { p.y = bgCanvas.height + 10; p.x = Math.random() * bgCanvas.width; }
                if (p.x < -10) p.x = bgCanvas.width + 10;
                if (p.x > bgCanvas.width + 10) p.x = -10;

                bgCtx.beginPath();
                bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                bgCtx.fillStyle = `rgba(77, 166, 255, ${p.opacity})`;
                bgCtx.fill();
            });
        }

        function drawStars() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            stars.forEach(s => {
                s.twinklePhase += s.twinkleSpeed;
                const opacity = 0.3 + Math.abs(Math.sin(s.twinklePhase)) * 0.7;
                bgCtx.beginPath();
                bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                bgCtx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                bgCtx.fill();
            });
        }

        function drawGradient() {
            gradientHue = (gradientHue + 0.15) % 360;
            const grad = bgCtx.createLinearGradient(0, 0, bgCanvas.width, bgCanvas.height);
            grad.addColorStop(0, `hsla(${gradientHue}, 60%, 15%, 0.5)`);
            grad.addColorStop(1, `hsla(${(gradientHue + 80) % 360}, 60%, 12%, 0.5)`);
            bgCtx.fillStyle = grad;
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
        }

        function drawShapeAt(s) {
            bgCtx.save();
            bgCtx.translate(s.x, s.y);
            bgCtx.rotate(s.rotation);
            bgCtx.fillStyle = `rgba(161, 36, 255, ${s.opacity})`;

            if (s.type === 'circle') {
                bgCtx.beginPath();
                bgCtx.arc(0, 0, s.size / 2, 0, Math.PI * 2);
                bgCtx.fill();
            } else if (s.type === 'square') {
                bgCtx.fillRect(-s.size / 2, -s.size / 2, s.size, s.size);
            } else {
                bgCtx.beginPath();
                bgCtx.moveTo(0, -s.size / 2);
                bgCtx.lineTo(s.size / 2, s.size / 2);
                bgCtx.lineTo(-s.size / 2, s.size / 2);
                bgCtx.closePath();
                bgCtx.fill();
            }
            bgCtx.restore();
        }

        function drawShapes() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            shapes.forEach(s => {
                s.y -= s.speed;
                s.rotation += s.rotSpeed;
                if (s.y < -50) { s.y = bgCanvas.height + 50; s.x = Math.random() * bgCanvas.width; }
                drawShapeAt(s);
            });
        }

        function bgLoop() {
            if (bgMode === 'particles') drawParticles();
            else if (bgMode === 'stars') drawStars();
            else if (bgMode === 'gradient') drawGradient();
            else if (bgMode === 'shapes') drawShapes();
            bgAnimFrame = requestAnimationFrame(bgLoop);
        }

        function changeBackground(mode) {
            bgMode = mode;
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            if (mode === 'none') {
                if (bgAnimFrame) cancelAnimationFrame(bgAnimFrame);
                return;
            }
            if (mode === 'particles') initParticles();
            if (mode === 'stars') initStars();
            if (mode === 'shapes') initShapes();
            if (bgAnimFrame) cancelAnimationFrame(bgAnimFrame);
            bgAnimFrame = requestAnimationFrame(bgLoop);
        }

        // Start with particles by default
        initParticles();
        bgLoop();
    </script>

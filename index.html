<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>look how cool</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 50px;
            background: #f0f0f0;
        }
        .card {
            background: white;
            /* Added padding on the bottom to make room for your corner image */
            padding: 30px 30px 110px 30px;
            display: inline-block;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-width: 320px; 
            max-width: 680px; /* Kept the main white card nice and wide */
            box-sizing: border-box;
            /* This lets us lock elements inside to the card's edges */
            position: relative; 
        }
        .my-link {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }
        .my-link:hover {
            color: #004499;
            text-decoration: underline;
        }
        /* Custom styles for your brand new native video player */
        .my-video {
            display: block;
            margin: 20px auto;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .my-gif {
            display: block;
            margin: 20px auto 0 auto;
            border-radius: 6px;
            max-width: 100%;
            height: auto;
        }
        /* Forces the container into the literal bottom-right corner of the white card */
        .bottom-right-container {
            position: absolute;
            bottom: 15px;
            right: 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .credit-text {
            font-size: 11px;
            color: #777777;
            margin: 0 0 4px 0;
            font-style: italic;
        }
        .my-small-image {
            display: block;
            border-radius: 4px;
            width: 75px !important;  /* Made it slightly smaller to look clean in the very corner */
            height: auto;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>look at my website</h1>
        <p>now always online!!! thanks github :D</p>
        <p><a class="my-link" href="https://youtube.com" target="_blank">Click :0</a></p>
        
        <!-- NEW LOCAL VIDEO PLAYER SECTION (Now shrunken down to just 200px wide) -->
        <video class="my-video" width="200" controls muted>
            <source src="videoforwebsite.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <!-- THE ORIGINAL GIF -->
        <img class="my-gif" src="animation.gif" alt="should play a gif" width="300">

        <!-- PINNED TO THE VERY BOTTOM RIGHT -->
        <div class="bottom-right-container">
            <p class="credit-text">made by thinker cat</p>
            <img class="my-small-image" src="thinker.png" alt="thinker cat image">
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 - thinker cat</title>

<style>
    body {
        background: #1e1e24;
        font-family: sans-serif;
        color: #ffffff;
        text-align: center;
        margin: 0;
        padding: 30px 15px;
    }

    h1 {
        margin-bottom: 5px;
    }

    .subtitle {
        color: #a0a0b0;
        font-size: 13px;
        margin-top: 0;
        margin-bottom: 20px;
    }

    .stat-row {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 16px;
    }

    .stat-box {
        background: #2a2a35;
        border-radius: 8px;
        padding: 8px 20px;
    }

    .stat-label {
        font-size: 11px;
        color: #a0a0b0;
        display: block;
    }

    .stat-value {
        font-size: 20px;
        font-weight: bold;
        color: #ffee00;
    }

    #board {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: 10px;
        width: 340px;
        height: 340px;
        margin: 0 auto;
        background: #2a2a35;
        border-radius: 10px;
        padding: 10px;
        box-sizing: border-box;
        position: relative;
    }

    .cell {
        background: #383846;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        font-weight: bold;
        transition: background 0.1s ease, transform 0.1s ease;
    }

    .cell.pop {
        animation: pop 0.15s ease;
    }

    @keyframes pop {
        0% { transform: scale(0.7); }
        100% { transform: scale(1); }
    }

    /* Tile colors by value */
    .v2 { background: #3a3a4a; color: #ffffff; }
    .v4 { background: #46465a; color: #ffffff; }
    .v8 { background: #ff9900; color: #1e1e24; }
    .v16 { background: #ff7700; color: #ffffff; }
    .v32 { background: #ff5555; color: #ffffff; }
    .v64 { background: #ff3333; color: #ffffff; }
    .v128 { background: #ffee00; color: #1e1e24; font-size: 22px; }
    .v256 { background: #ffdd00; color: #1e1e24; font-size: 22px; }
    .v512 { background: #39ff14; color: #1e1e24; font-size: 22px; }
    .v1024 { background: #00f2ff; color: #1e1e24; font-size: 18px; }
    .v2048 { background: #a124ff; color: #ffffff; font-size: 18px; box-shadow: 0 0 15px rgba(161,36,255,0.7); }

    #restartBtn {
        margin-top: 20px;
        padding: 10px 22px;
        background: #4da6ff;
        color: #1e1e24;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        font-size: 14px;
    }

    .controls {
        margin-top: 14px;
        font-size: 12px;
        color: #a0a0b0;
    }

    .message {
        font-size: 18px;
        font-weight: bold;
        margin-top: 14px;
        display: none;
    }
</style>
</head>
<body>

    <h1>🔢 2048</h1>
    <p class="subtitle">made by thinker cat</p>

    <div class="stat-row">
        <div class="stat-box">
            <span class="stat-label">SCORE</span>
            <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">BEST</span>
            <span class="stat-value" id="bestScore">0</span>
        </div>
    </div>

    <div id="board"></div>

    <p class="message" id="message"></p>
    <button id="restartBtn" onclick="startGame()">New Game</button>
    <p class="controls">Arrow keys or swipe to slide the tiles</p>

<script>
const SIZE = 4;
let grid, score, best, gameOver, won, keepPlayingAfterWin;

function loadBest() {
    try {
        const saved = localStorage.getItem('thinkerCat2048Best');
        return saved ? parseInt(saved, 10) : 0;
    } catch (e) {
        return 0;
    }
}

function saveBest(val) {
    try {
        localStorage.setItem('thinkerCat2048Best', val.toString());
    } catch (e) {
        // storage unavailable, game still works
    }
}

function emptyGrid() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
}

function getEmptyCells() {
    const cells = [];
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] === 0) cells.push([r, c]);
        }
    }
    return cells;
}

function addRandomTile() {
    const empty = getEmptyCells();
    if (empty.length === 0) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
}

function startGame() {
    grid = emptyGrid();
    score = 0;
    gameOver = false;
    won = false;
    keepPlayingAfterWin = false;
    best = loadBest();
    addRandomTile();
    addRandomTile();
    document.getElementById('message').style.display = 'none';
    document.getElementById('restartBtn').style.display = 'none';
    updateStats();
    render();
}

function updateStats() {
    document.getElementById('score').textContent = score;
    document.getElementById('bestScore').textContent = best;
}

function render() {
    const board = document.getElementById('board');
    board.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            const val = grid[r][c];
            const cell = document.createElement('div');
            cell.className = 'cell' + (val ? ' v' + val + ' pop' : '');
            cell.textContent = val || '';
            board.appendChild(cell);
        }
    }
}

function slideRowLeft(row) {
    let arr = row.filter(v => v !== 0);
    let gained = 0;
    for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
            arr[i] *= 2;
            gained += arr[i];
            arr.splice(i + 1, 1);
        }
    }
    while (arr.length < SIZE) arr.push(0);
    return { row: arr, gained };
}

function rotateGridCW(g) {
    const newGrid = emptyGrid();
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            newGrid[c][SIZE - 1 - r] = g[r][c];
        }
    }
    return newGrid;
}

function move(direction) {
    if (gameOver) return;

    let rotations = 0;
    if (direction === 'up') rotations = 3;
    else if (direction === 'right') rotations = 2;
    else if (direction === 'down') rotations = 1;
    // left = 0 rotations

    let working = grid;
    for (let i = 0; i < rotations; i++) working = rotateGridCW(working);

    let moved = false;
    let totalGained = 0;
    const newGrid = working.map(row => {
        const before = row.join(',');
        const { row: newRow, gained } = slideRowLeft(row);
        if (newRow.join(',') !== before) moved = true;
        totalGained += gained;
        return newRow;
    });

    let result = newGrid;
    const restoreRotations = (4 - rotations) % 4;
    for (let i = 0; i < restoreRotations; i++) result = rotateGridCW(result);

    if (!moved) return;

    grid = result;
    score += totalGained;
    if (score > best) {
        best = score;
        saveBest(best);
    }
    addRandomTile();
    updateStats();
    render();

    checkWin();
    checkGameOver();
}

function checkWin() {
    if (won || keepPlayingAfterWin) return;
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] === 2048) {
                won = true;
                showMessage('🎉 You made 2048! Keep playing to go further, or start over.');
            }
        }
    }
}

function checkGameOver() {
    if (getEmptyCells().length > 0) return;
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            const val = grid[r][c];
            if (c < SIZE - 1 && grid[r][c + 1] === val) return;
            if (r < SIZE - 1 && grid[r + 1][c] === val) return;
        }
    }
    gameOver = true;
    showMessage('Game Over — Score: ' + score);
    document.getElementById('restartBtn').style.display = 'inline-block';
}

function showMessage(text) {
    const msg = document.getElementById('message');
    msg.textContent = text;
    msg.style.display = 'block';
    document.getElementById('restartBtn').style.display = 'inline-block';
}

document.addEventListener('keydown', e => {
    const keyMap = {
        ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right'
    };
    if (keyMap[e.key]) {
        e.preventDefault();
        move(keyMap[e.key]);
    }
});

// Basic swipe support for touch devices
let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
});
document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
    if (Math.abs(dx) > Math.abs(dy)) {
        move(dx > 0 ? 'right' : 'left');
    } else {
        move(dy > 0 ? 'down' : 'up');
    }
});

startGame();
</script>

</body>
</html>

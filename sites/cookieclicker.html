<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cookie clicker - thinker cat</title>
<style>
    body {
        background: #1e1e24;
        font-family: sans-serif;
        color: #ffffff;
        text-align: center;
        margin: 0;
        padding: 30px 15px;
    }

    h1 {
        margin-bottom: 5px;
    }

    .subtitle {
        color: #a0a0b0;
        font-size: 13px;
        margin-top: 0;
    }

    .game-wrap {
        display: flex;
        justify-content: center;
        gap: 30px;
        margin-top: 25px;
        flex-wrap: wrap;
    }

    .cookie-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .cookie-count {
        font-size: 32px;
        font-weight: bold;
        color: #ffee00;
        margin-bottom: 4px;
    }

    .cps-label {
        color: #a0a0b0;
        font-size: 14px;
        margin-bottom: 20px;
    }

    #cookieBtn {
        font-size: 100px;
        background: none;
        border: none;
        cursor: pointer;
        user-select: none;
        transition: transform 0.08s ease;
        filter: drop-shadow(0 0 20px rgba(255, 238, 0, 0.3));
    }

    #cookieBtn:active {
        transform: scale(0.9);
    }

    .float-text {
        position: absolute;
        color: #ffee00;
        font-weight: bold;
        font-size: 18px;
        pointer-events: none;
        animation: floatUp 0.8s ease-out forwards;
    }

    @keyframes floatUp {
        0% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-60px); }
    }

    .shop {
        background: #2a2a35;
        border-radius: 12px;
        padding: 20px;
        width: 300px;
        max-height: 500px;
        overflow-y: auto;
        text-align: left;
    }

    .shop h3 {
        margin-top: 0;
        color: #ffee00;
        text-align: center;
    }

    .upgrade {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #383846;
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 10px;
        cursor: pointer;
        transition: background 0.15s ease, opacity 0.15s ease;
        border: 1px solid transparent;
    }

    .upgrade:hover {
        background: #45455a;
        border-color: #4da6ff;
    }

    .upgrade.disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .upgrade.disabled:hover {
        background: #383846;
        border-color: transparent;
    }

    .upgrade-info {
        display: flex;
        flex-direction: column;
    }

    .upgrade-name {
        font-weight: bold;
        font-size: 14px;
    }

    .upgrade-desc {
        font-size: 11px;
        color: #a0a0b0;
    }

    .upgrade-cost {
        font-size: 13px;
        font-weight: bold;
        color: #ffee00;
        white-space: nowrap;
        margin-left: 10px;
    }

    .upgrade-owned {
        font-size: 11px;
        color: #4da6ff;
    }

    .reset-btn {
        margin-top: 20px;
        padding: 8px 14px;
        background: #ff5555;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        font-size: 12px;
    }
</style>
</head>
<body>

    <h1>🍪 COOKIE CLICKER</h1>
    <p class="subtitle">made by thinker cat</p>

    <div class="game-wrap">
        <div class="cookie-panel" id="cookiePanel" style="position: relative;">
            <div class="cookie-count" id="cookieCount">0 cookies</div>
            <div class="cps-label" id="cpsLabel">0 per second</div>
            <button id="cookieBtn" onclick="clickCookie(event)">🍪</button>
            <button class="reset-btn" onclick="resetGame()">Reset Game</button>
        </div>

        <div class="shop">
            <h3>UPGRADES</h3>
            <div id="upgradeList"></div>
        </div>
    </div>

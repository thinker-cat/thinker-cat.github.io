<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>emoji mixer - thinker cat</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-RWVD8FSGK1"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-RWVD8FSGK1');
</script>

<style>
    body {
        background: #1e1e24;
        font-family: sans-serif;
        color: #ffffff;
        text-align: center;
        margin: 0;
        padding: 30px 15px;
    }

    h1 {
        margin-bottom: 5px;
    }

    .subtitle {
        color: #a0a0b0;
        font-size: 13px;
        margin-top: 0;
        margin-bottom: 25px;
    }

    .mixer-wrap {
        max-width: 700px;
        margin: 0 auto;
    }

    .picker-row {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .picker-box {
        background: #2a2a35;
        border-radius: 12px;
        padding: 15px;
        width: 280px;
    }

    .picker-label {
        font-size: 12px;
        color: #a0a0b0;
        margin-bottom: 8px;
    }

    .selected-emoji {
        font-size: 50px;
        margin-bottom: 10px;
    }

    .emoji-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 6px;
        max-height: 140px;
        overflow-y: auto;
    }

    .emoji-option {
        font-size: 22px;
        background: #383846;
        border-radius: 6px;
        padding: 6px;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.1s ease;
    }

    .emoji-option:hover {
        background: #45455a;
        transform: scale(1.1);
    }

    .emoji-option.active {
        background: #4da6ff;
    }

    .style-row {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 16px;
        flex-wrap: wrap;
    }

    .style-btn {
        padding: 8px 14px;
        border-radius: 20px;
        border: 2px solid #383846;
        background: #2a2a35;
        color: #ffffff;
        font-size: 12px;
        cursor: pointer;
    }

    .style-btn.active {
        border-color: #4da6ff;
        background: #383858;
    }

    #mixCanvas {
        background: #2a2a35;
        border-radius: 16px;
        margin: 10px auto 20px auto;
        display: block;
    }

    .btn-row {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    button.action {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        font-size: 14px;
        cursor: pointer;
    }

    #mixBtn {
        background: #ffee00;
        color: #1e1e24;
    }

    #shuffleBtn {
        background: #a124ff;
        color: #ffffff;
    }

    #downloadBtn {
        background: #39ff14;
        color: #1e1e24;
    }
</style>
</head>
<body>

    <h1>🍳 EMOJI MIXER</h1>
    <p class="subtitle">made by thinker cat — smash two emojis together</p>

    <div class="mixer-wrap">
        <div class="picker-row">
            <div class="picker-box">
                <div class="picker-label">Emoji 1</div>
                <div class="selected-emoji" id="selected1">😀</div>
                <div class="emoji-grid" id="grid1"></div>
            </div>
            <div class="picker-box">
                <div class="picker-label">Emoji 2</div>
                <div class="selected-emoji" id="selected2">🔥</div>
                <div class="emoji-grid" id="grid2"></div>
            </div>
        </div>

        <div class="style-row">
            <button class="style-btn active" data-style="overlap" onclick="setStyle('overlap')">Overlap</button>
            <button class="style-btn" data-style="sidebyside" onclick="setStyle('sidebyside')">Side by Side</button>
            <button class="style-btn" data-style="stacked" onclick="setStyle('stacked')">Stacked</button>
            <button class="style-btn" data-style="explosion" onclick="setStyle('explosion')">Explosion</button>
        </div>

        <canvas id="mixCanvas" width="300" height="300"></canvas>

        <div class="btn-row">
            <button class="action" id="mixBtn" onclick="mixEmojis()">🍳 Mix It!</button>
            <button class="action" id="shuffleBtn" onclick="shuffleEmojis()">🎲 Random Mix</button>
            <button class="action" id="downloadBtn" onclick="downloadMix()">⬇️ Download</button>
        </div>
    </div>

<script>
const EMOJIS = [
    '😀','😂','😍','🥳','😎','🤔','😭','😡','🥶','🤯','😱','🤢',
    '🔥','💀','👻','👽','🤖','🐱','🐶','🐸','🦄','🐉','🦋','🐢',
    '🍕','🍔','🍎','🍩','🍦','🎂','☕','🍺','🌮','🍟','🍭','🥑',
    '⚡','🌈','🌙','⭐','☀️','❄️','🌊','🌪️','🎃','🎄','💎','🎈',
    '❤️','💩','👑','🎮','⚽','🚀','🎸','📱','💰','🔮','🗿','🧠'
];

let emoji1 = '😀';
let emoji2 = '🔥';
let currentStyle = 'overlap';

const canvas = document.getElementById('mixCanvas');
const ctx = canvas.getContext('2d');

function buildGrid(gridId, selectedId, isFirst) {
    const grid = document.getElementById(gridId);
    grid.innerHTML = '';
    EMOJIS.forEach(e => {
        const div = document.createElement('div');
        div.className = 'emoji-option';
        div.textContent = e;
        div.onclick = () => {
            if (isFirst) emoji1 = e; else emoji2 = e;
            document.getElementById(selectedId).textContent = e;
            highlightActive(gridId, e);
        };
        grid.appendChild(div);
    });
}

function highlightActive(gridId, value) {
    document.querySelectorAll('#' + gridId + ' .emoji-option').forEach(el => {
        el.classList.toggle('active', el.textContent === value);
    });
}

function setStyle(style) {
    currentStyle = style;
    document.querySelectorAll('.style-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.style === style);
    });
    mixEmojis();
}

function mixEmojis() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (currentStyle === 'overlap') {
        ctx.save();
        ctx.translate(110, 150);
        ctx.rotate(-0.2);
        ctx.globalAlpha = 0.9;
        ctx.font = '150px sans-serif';
        ctx.fillText(emoji1, 0, 0);
        ctx.restore();

        ctx.save();
        ctx.translate(190, 150);
        ctx.rotate(0.2);
        ctx.globalAlpha = 0.9;
        ctx.font = '120px sans-serif';
        ctx.fillText(emoji2, 0, 0);
        ctx.restore();

    } else if (currentStyle === 'sidebyside') {
        ctx.font = '110px sans-serif';
        ctx.fillText(emoji1, 90, 150);
        ctx.fillText(emoji2, 210, 150);

    } else if (currentStyle === 'stacked') {
        ctx.font = '110px sans-serif';
        ctx.fillText(emoji1, 150, 95);
        ctx.fillText(emoji2, 150, 210);

    } else if (currentStyle === 'explosion') {
        for (let i = 0; i < 8; i++) {
            const angle = (Math.PI * 2 / 8) * i;
            const dist = 55;
            ctx.save();
            ctx.translate(150 + Math.cos(angle) * dist, 150 + Math.sin(angle) * dist);
            ctx.globalAlpha = 0.35;
            ctx.font = '50px sans-serif';
            ctx.fillText(i % 2 === 0 ? emoji1 : emoji2, 0, 0);
            ctx.restore();
        }
        ctx.font = '90px sans-serif';
        ctx.globalAlpha = 1;
        ctx.fillText(emoji1, 130, 150);
        ctx.fillText(emoji2, 175, 150);
    }

    ctx.globalAlpha = 1;
}

function shuffleEmojis() {
    emoji1 = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    emoji2 = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    document.getElementById('selected1').textContent = emoji1;
    document.getElementById('selected2').textContent = emoji2;
    highlightActive('grid1', emoji1);
    highlightActive('grid2', emoji2);
    mixEmojis();
}

function downloadMix() {
    const link = document.createElement('a');
    link.download = 'emoji-mix.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
}

buildGrid('grid1', 'selected1', true);
buildGrid('grid2', 'selected2', false);
highlightActive('grid1', emoji1);
highlightActive('grid2', emoji2);
mixEmojis();
</script>

</body>
</html>

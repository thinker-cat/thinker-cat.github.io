        font-family: sans-serif;

        border-radius: 12px;
        padding: 18px 22px;
        text-decoration: none;
        color: #ffffff;
        text-align: left;
        transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .site-card:hover {
        transform: translateY(-2px);
        border-color: #4da6ff;
        box-shadow: 0 6px 18px rgba(77, 166, 255, 0.2);
    }

    .site-emoji {
        font-size: 30px;
    }

    .site-info {
        display: flex;
        flex-direction: column;
    }

    .site-name {
        font-weight: bold;
        font-size: 17px;
    }

    .site-desc {
        font-size: 12px;
        color: #a0a0b0;

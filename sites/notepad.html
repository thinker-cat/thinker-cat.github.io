<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>notepad - thinker cat</title>

<style>
    body {
        background: #1e1e24;
        font-family: sans-serif;
        color: #ffffff;
        text-align: center;
        margin: 0;
        padding: 30px 15px;
    }

    h1 {
        margin-bottom: 5px;
    }

    .subtitle {
        color: #a0a0b0;
        font-size: 13px;
        margin-top: 0;
        margin-bottom: 20px;
    }

    .notepad-wrap {
        max-width: 700px;
        margin: 0 auto;
    }

    textarea {
        width: 100%;
        height: 60vh;
        min-height: 350px;
        background: #2a2a35;
        color: #ffffff;
        border: 1px solid #383846;
        border-radius: 10px;
        padding: 20px;
        font-size: 16px;
        font-family: sans-serif;
        line-height: 1.5;
        box-sizing: border-box;
        resize: vertical;
        outline: none;
        transition: border-color 0.2s ease;
    }

    textarea:focus {
        border-color: #4da6ff;
    }

    .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
        flex-wrap: wrap;
        gap: 10px;
    }

    .save-status {
        font-size: 12px;
        color: #a0a0b0;
        text-align: left;
    }

    .btn-row {
        display: flex;
        gap: 10px;
    }

    button {
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        font-size: 13px;
        cursor: pointer;
    }

    #clearBtn {
        background: #ff5555;
        color: #ffffff;
    }

    #downloadBtn {
        background: #4da6ff;
        color: #1e1e24;
    }
</style>
</head>
<body>

    <h1>📝 NOTEPAD</h1>
    <p class="subtitle">made by thinker cat — type anything, it saves automatically</p>

    <div class="notepad-wrap">
        <textarea id="noteArea" placeholder="Start typing..."></textarea>

        <div class="toolbar">
            <span class="save-status" id="saveStatus">Saved</span>
            <div class="btn-row">
                <button id="downloadBtn" onclick="downloadNote()">Download as .txt</button>
                <button id="clearBtn" onclick="clearNote()">Clear</button>
            </div>
        </div>
    </div>

<script>
const noteArea = document.getElementById('noteArea');
const saveStatus = document.getElementById('saveStatus');
let saveTimeout;

function loadNote() {
    try {
        const saved = localStorage.getItem('thinkerCatNotepad');
        if (saved) noteArea.value = saved;
    } catch (e) {
        // storage unavailable — notepad still works, just won't persist
    }
}

function saveNote() {
    try {
        localStorage.setItem('thinkerCatNotepad', noteArea.value);
        saveStatus.textContent = 'Saved';
    } catch (e) {
        saveStatus.textContent = 'Could not save (storage unavailable)';
    }
}

noteArea.addEventListener('input', () => {
    saveStatus.textContent = 'Saving...';
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(saveNote, 400);
});

function clearNote() {
    if (confirm('Clear all your notes? This cannot be undone.')) {
        noteArea.value = '';
        saveNote();
    }
}

function downloadNote() {
    const blob = new Blob([noteArea.value], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'notes.txt';
    a.click();
    URL.revokeObjectURL(url);
}

loadNote();
</script>

</body>
</html>

<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>paint - thinker cat</title>

<style>
    body {
        background: #1e1e24;
        font-family: sans-serif;
        color: #ffffff;
        text-align: center;
        margin: 0;
        padding: 25px 15px;
    }

    h1 {
        margin-bottom: 5px;
    }

    .subtitle {
        color: #a0a0b0;
        font-size: 13px;
        margin-top: 0;
        margin-bottom: 20px;
    }

    .paint-wrap {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
    }

    .toolbar {
        display: flex;
        align-items: center;
        gap: 14px;
        background: #2a2a35;
        padding: 12px 18px;
        border-radius: 10px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 800px;
    }

    .tool-group {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .tool-label {
        font-size: 11px;
        color: #a0a0b0;
    }

    .tool-btn {
        width: 34px;
        height: 34px;
        border-radius: 6px;
        border: 2px solid transparent;
        background: #383846;
        color: #ffffff;
        cursor: pointer;
        font-size: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .tool-btn.active {
        border-color: #4da6ff;
        background: #45455a;
    }

    input[type="color"] {
        width: 34px;
        height: 34px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background: none;
        padding: 0;
    }

    input[type="range"] {
        width: 90px;
    }

    .action-btn {
        padding: 8px 14px;
        border-radius: 6px;
        border: none;
        font-weight: bold;
        font-size: 12px;
        cursor: pointer;
    }

    #clearBtn {
        background: #ff5555;
        color: #ffffff;
    }

    #downloadBtn {
        background: #39ff14;
        color: #1e1e24;
    }

    #canvasWrap {
        border: 3px solid #4da6ff;
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(77, 166, 255, 0.3);
        overflow: hidden;
        touch-action: none;
    }

    canvas {
        display: block;
        background: #ffffff;
        cursor: crosshair;
    }
</style>
</head>
<body>

    <h1>🎨 PAINT</h1>
    <p class="subtitle">made by thinker cat</p>

    <div class="paint-wrap">
        <div class="toolbar">
            <div class="tool-group">
                <button class="tool-btn active" id="pencilBtn" onclick="setTool('pencil')" title="Pencil">✏️</button>
                <button class="tool-btn" id="eraserBtn" onclick="setTool('eraser')" title="Eraser">🧽</button>
                <button class="tool-btn" id="fillBtn" onclick="setTool('fill')" title="Fill">🪣</button>
            </div>

            <div class="tool-group">
                <span class="tool-label">Color</span>
                <input type="color" id="colorPicker" value="#000000">
            </div>

            <div class="tool-group">
                <span class="tool-label">Size</span>
                <input type="range" id="sizeSlider" min="1" max="40" value="5">
            </div>

            <div class="tool-group">
                <button class="action-btn" id="downloadBtn" onclick="downloadImage()">Save as PNG</button>
                <button class="action-btn" id="clearBtn" onclick="clearCanvas()">Clear</button>
            </div>
        </div>

        <div id="canvasWrap">
            <canvas id="paintCanvas" width="800" height="500"></canvas>
        </div>
    </div>

<script>
const canvas = document.getElementById('paintCanvas');
const ctx = canvas.getContext('2d');
const colorPicker = document.getElementById('colorPicker');
const sizeSlider = document.getElementById('sizeSlider');

let tool = 'pencil';
let drawing = false;
let lastX = 0;
let lastY = 0;

function setTool(newTool) {
    tool = newTool;
    document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(newTool + 'Btn').classList.add('active');
    canvas.style.cursor = newTool === 'fill' ? 'pointer' : 'crosshair';
}

function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    if (e.touches && e.touches.length > 0) {
        return {
            x: (e.touches[0].clientX - rect.left) * scaleX,
            y: (e.touches[0].clientY - rect.top) * scaleY
        };
    }
    return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
    };
}

function startDraw(e) {
    e.preventDefault();
    const pos = getPos(e);

    if (tool === 'fill') {
        floodFill(Math.floor(pos.x), Math.floor(pos.y), colorPicker.value);
        return;
    }

    drawing = true;
    lastX = pos.x;
    lastY = pos.y;
    drawDot(pos.x, pos.y);
}

function draw(e) {
    if (!drawing) return;
    e.preventDefault();
    const pos = getPos(e);
    drawLine(lastX, lastY, pos.x, pos.y);
    lastX = pos.x;
    lastY = pos.y;
}

function stopDraw() {
    drawing = false;
}

function drawDot(x, y) {
    ctx.fillStyle = tool === 'eraser' ? '#ffffff' : colorPicker.value;
    ctx.beginPath();
    ctx.arc(x, y, sizeSlider.value / 2, 0, Math.PI * 2);
    ctx.fill();
}

function drawLine(x1, y1, x2, y2) {
    ctx.strokeStyle = tool === 'eraser' ? '#ffffff' : colorPicker.value;
    ctx.lineWidth = sizeSlider.value;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
}

function hexToRgba(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return [r, g, b, 255];
}

function floodFill(startX, startY, fillHex) {
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data;
    const width = canvas.width;
    const height = canvas.height;

    const getIndex = (x, y) => (y * width + x) * 4;
    const startIdx = getIndex(startX, startY);
    const startColor = [data[startIdx], data[startIdx + 1], data[startIdx + 2], data[startIdx + 3]];
    const fillColor = hexToRgba(fillHex);

    if (startColor.every((v, i) => v === fillColor[i])) return;

    const matches = (idx) => (
        data[idx] === startColor[0] &&
        data[idx + 1] === startColor[1] &&
        data[idx + 2] === startColor[2] &&
        data[idx + 3] === startColor[3]
    );

    const stack = [[startX, startY]];
    while (stack.length) {
        const [x, y] = stack.pop();
        if (x < 0 || x >= width || y < 0 || y >= height) continue;
        const idx = getIndex(x, y);
        if (!matches(idx)) continue;

        data[idx] = fillColor[0];
        data[idx + 1] = fillColor[1];
        data[idx + 2] = fillColor[2];
        data[idx + 3] = fillColor[3];

        stack.push([x + 1, y]);
        stack.push([x - 1, y]);
        stack.push([x, y + 1]);
        stack.push([x, y - 1]);
    }

    ctx.putImageData(imgData, 0, 0);
}

function clearCanvas() {
    if (confirm('Clear the whole canvas?')) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
}

function downloadImage() {
    const link = document.createElement('a');
    link.download = 'my-drawing.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
}

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', stopDraw);
canvas.addEventListener('mouseleave', stopDraw);

canvas.addEventListener('touchstart', startDraw);
canvas.addEventListener('touchmove', draw);
canvas.addEventListener('touchend', stopDraw);

// Start with a white background
ctx.fillStyle = '#ffffff';
ctx.fillRect(0, 0, canvas.width, canvas.height);
</script>

</body>
</html>

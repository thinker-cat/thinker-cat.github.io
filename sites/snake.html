<style>
    body {
        background: #1e1e24;
        font-family: sans-serif;
        color: #ffffff;
        text-align: center;
        margin-top: 30px;
    }

    h1 {
        margin-bottom: 5px;
    }

    .subtitle {
        color: #a0a0b0;
        font-size: 13px;
        margin-top: 0;
    }

    .game-wrap {
        display: inline-flex;
        gap: 25px;
        margin-top: 20px;
        align-items: flex-start;
    }

    canvas {
        background: #121218;
        border: 3px solid #39ff14;
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(57, 255, 20, 0.3);
    }

    .sidebar {
        text-align: left;
        background: #2a2a35;
        padding: 20px;
        border-radius: 10px;
        width: 160px;
    }

    .sidebar h3 {
        margin-top: 0;
        font-size: 14px;
        color: #39ff14;
    }

    .sidebar p {
        font-size: 14px;
        margin: 6px 0;
    }

    .controls {
        margin-top: 15px;
        font-size: 12px;
        color: #a0a0b0;
        line-height: 1.6;
    }

    #restartBtn {
        margin-top: 15px;
        padding: 8px 14px;
        background: #39ff14;
        color: #1e1e24;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        display: none;
    }

    #gameOverMsg {
        color: #ff5555;
        font-weight: bold;
        display: none;
        margin-top: 10px;
    }

    .canvas-wrap {
        position: relative;
        display: inline-block;
    }

    .countdown {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 72px;
        font-weight: bold;
        color: #39ff14;
        text-shadow: 0 0 20px rgba(57, 255, 20, 0.6);
        pointer-events: none;
    }
</style>
</head>
<body>

    <h1>🐍 SNAKE</h1>
    <p class="subtitle">made by thinker cat</p>

    <div class="game-wrap">
        <div class="canvas-wrap">
            <canvas id="board" width="400" height="400"></canvas>
            <div class="countdown" id="countdown"></div>
        </div>

        <div class="sidebar">
            <h3>SCORE</h3>
            <p id="score">0</p>
            <h3>HIGH SCORE</h3>
            <p id="highScore">0</p>

            <p id="gameOverMsg">GAME OVER</p>
            <button id="restartBtn" onclick="restartGame()">Restart</button>

            <div class="controls">
                ⬅️➡️⬆️⬇️ Move<br>
                Eat the dots<br>
                Don't hit yourself<br>
                or the walls!
            </div>
        </div>
    </div>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const GRID = 20;
const CELLS = canvas.width / GRID;

let snake, direction, nextDirection, food, score, highScore, gameOver, gameInterval, directionLocked;

function loadHighScore() {
    try {
        const saved = localStorage.getItem('thinkerCatSnakeHighScore');
        return saved ? parseInt(saved, 10) : 0;
    } catch (e) {
        return 0;
    }
}

function saveHighScore(val) {
    try {
        localStorage.setItem('thinkerCatSnakeHighScore', val.toString());
    } catch (e) {
        // storage unavailable — game still works fine without saving
    }
}

function randomCell() {
    return Math.floor(Math.random() * CELLS);
}

function placeFood() {
    let newFood;
    do {
        newFood = { x: randomCell(), y: randomCell() };
    } while (snake.some(seg => seg.x === newFood.x && seg.y === newFood.y));
    food = newFood;
}

function restartGame() {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    directionLocked = false;
    score = 0;
    gameOver = false;
    placeFood();
    updateSidebar();
    document.getElementById('gameOverMsg').style.display = 'none';
    document.getElementById('restartBtn').style.display = 'none';

    if (gameInterval) clearInterval(gameInterval);
    draw();
    startCountdown();
}

function startCountdown() {
    const countdownEl = document.getElementById('countdown');
    const steps = ['3', '2', '1', 'GO!'];
    let i = 0;

    countdownEl.textContent = steps[i];
    const countdownInterval = setInterval(() => {
        i++;
        if (i < steps.length) {
            countdownEl.textContent = steps[i];
        } else {
            clearInterval(countdownInterval);
            countdownEl.textContent = '';
            gameInterval = setInterval(tick, 80);
        }
    }, 500);
}

function updateSidebar() {
    document.getElementById('score').textContent = score;
    document.getElementById('highScore').textContent = highScore;
}

function endGame() {
    gameOver = true;
    clearInterval(gameInterval);
    if (score > highScore) {
        highScore = score;
        saveHighScore(highScore);
    }
    updateSidebar();
    document.getElementById('gameOverMsg').style.display = 'block';
    document.getElementById('restartBtn').style.display = 'inline-block';
}

function tick() {
    direction = nextDirection;
    directionLocked = false;
    const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

    if (head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS) {
        endGame();
        return;
    }
    if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        endGame();
        return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
        score += 10;
        updateSidebar();
        placeFood();
    } else {
        snake.pop();
    }

    draw();
}

function draw() {
    ctx.fillStyle = '#121218';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ff5555';
    ctx.beginPath();
    ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
    ctx.fill();

    snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? '#39ff14' : '#2fcc10';
        ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);
    });
}

document.addEventListener('keydown', e => {
    if (gameOver || directionLocked) return;
    if (e.key === 'ArrowUp' && direction.y === 0) { nextDirection = { x: 0, y: -1 }; directionLocked = true; }
    else if (e.key === 'ArrowDown' && direction.y === 0) { nextDirection = { x: 0, y: 1 }; directionLocked = true; }
    else if (e.key === 'ArrowLeft' && direction.x === 0) { nextDirection = { x: -1, y: 0 }; directionLocked = true; }
    else if (e.key === 'ArrowRight' && direction.x === 0) { nextDirection = { x: 1, y: 0 }; directionLocked = true; }
});

highScore = loadHighScore();
restartGame();
</script>

</body>
</html>
